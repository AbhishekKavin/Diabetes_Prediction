[project]
name = "diabetes-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "matplotlib>=3.11.1",
    "mlflow>=2.0",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "protobuf<5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "setuptools>=84.0.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/diabetes_api"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
